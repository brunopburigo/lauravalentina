<style>
  :root{
    --magenta:#E5237C;
    --magenta-deep:#C2185F;
    --navy:#0E1B33;
    --navy-soft:#16223E;
    --sage:#A3BC83;
    --sage-deep:#8FAA6E;
    --paper:#FFFFFF;
    --mist:#F4F2EE;
    --line:rgba(14,27,51,.12);
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  body{
    font-family:'Jost',sans-serif;
    color:var(--navy);
    background:var(--paper);
    min-height:100vh;
    display:flex;justify-content:center;
    background-image:radial-gradient(125% 60% at 50% -8%, #FFFFFF 0%, #FFFFFF 55%, var(--mist) 100%);
    -webkit-font-smoothing:antialiased;
  }

  .stage{
    width:100%;max-width:440px;
    padding:50px 26px 40px;
    display:flex;flex-direction:column;align-items:center;text-align:center;
  }

  /* ---------- Logo / medalhão ---------- */
  .badge{
    width:190px;height:190px;border-radius:50%;
    background:var(--magenta-deep);
    display:grid;place-items:center;
    margin-bottom:24px;
    box-shadow:0 16px 34px -16px rgba(185,18,92,.75);
    animation:rise .9s ease both;
    overflow:hidden;
  }
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
  .badge img{width:100%;height:100%;object-fit:cover;display:block;}

  /* ---------- Cabeçalho ---------- */
  .eyebrow{
    font-size:14px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--magenta-deep);font-weight:600;margin-bottom:30px;
    animation:rise .9s ease .05s both;
  }
  h1{
    font-family:'Jost',sans-serif;
    font-weight:500;font-size:33px;line-height:1.05;
    letter-spacing:.22em;text-transform:uppercase;
    color:var(--navy);margin:0 0 16px;padding-left:.22em;
    animation:rise .9s ease .1s both;
  }
  .tagline{
    font-family:'Fraunces',serif;font-style:italic;font-weight:400;
    font-size:18.5px;line-height:1.45;color:var(--navy);opacity:.82;
    max-width:300px;
    animation:rise .9s ease .15s both;
  }
  .divider{
    width:46px;height:2px;background:var(--magenta);
    margin:24px 0 30px;border-radius:2px;
    animation:rise .9s ease .2s both;
  }

  /* ---------- Botões ---------- */
  .links{width:100%;display:flex;flex-direction:column;gap:13px;}
  .link{
    display:flex;align-items:center;gap:14px;width:100%;
    padding:16px 20px;border-radius:15px;text-decoration:none;
    font-size:15.5px;letter-spacing:.01em;
    transition:transform .2s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
    animation:rise .9s ease both;
  }
  .link:nth-child(1){animation-delay:.26s}
  .link:nth-child(2){animation-delay:.32s}
  .link:nth-child(3){animation-delay:.38s}
  .link:nth-child(4){animation-delay:.44s}
  .link .ico{flex:0 0 22px;display:grid;place-items:center;}
  .link .label{flex:1;text-align:left;font-weight:400;}
  .link .sub{font-size:12px;letter-spacing:.03em;opacity:.72;display:block;margin-top:1px;font-weight:300;}
  .link .chev{opacity:.5;transition:transform .2s ease;}
  .link:hover .chev{transform:translateX(3px);}

  /* WhatsApp — principal (magenta da marca) */
  .link--primary{background:var(--magenta);color:#fff;box-shadow:0 12px 26px -12px rgba(229,35,124,.65);}
  .link--primary .sub{color:rgba(255,255,255,.8);}
  .link--primary:hover{background:var(--magenta-deep);transform:translateY(-2px);box-shadow:0 18px 32px -12px rgba(229,35,124,.7);}

  /* Instagram — marinho da marca */
  .link--navy{background:var(--navy);color:#fff;box-shadow:0 12px 26px -14px rgba(14,27,51,.6);}
  .link--navy .sub{color:rgba(255,255,255,.72);}
  .link--navy:hover{background:var(--navy-soft);transform:translateY(-2px);box-shadow:0 18px 32px -14px rgba(14,27,51,.65);}

  /* Secundários — claros com borda */
  .link--ghost{background:var(--paper);color:var(--navy);border:1px solid var(--line);}
  .link--ghost .ico{color:var(--magenta);}
  .link--ghost:hover{transform:translateY(-2px);border-color:var(--magenta);box-shadow:0 14px 28px -16px rgba(14,27,51,.35);}

  /* ---------- Rodapé ---------- */
  .info{
    margin-top:30px;font-size:12.5px;letter-spacing:.04em;
    color:var(--navy);opacity:.62;line-height:1.75;
    animation:rise .9s ease .5s both;
  }
  .info strong{font-weight:500;opacity:.95;}
  footer{
    margin-top:32px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--magenta);opacity:.85;font-weight:500;
    animation:rise .9s ease .55s both;
  }

  @keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  :focus-visible{outline:2px solid var(--magenta);outline-offset:3px;border-radius:8px;}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}
</style>
</head>
